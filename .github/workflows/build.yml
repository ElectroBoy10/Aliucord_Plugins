name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew make --stacktrace 2>&1 | tee build.log

      - name: Publish build log and zip to the builds branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp plugins/*/build/outputs/*.zip out/ 2>/dev/null || true
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.zip --title "Latest build" --notes "Built from commit ${GITHUB_SHA}"
